<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora v1</title>
    <style>
      body { margin: 0; overflow: hidden; background: #0a0e16; font-family: monospace; }
      #desktop-hud {
        position: fixed; top: 8px; left: 8px; z-index: 10;
        color: #cfe3ff; background: rgba(8,14,26,.82); padding: 10px 14px;
        border: 1px solid #2b4a72; border-radius: 6px;
        font-size: 12px; line-height: 1.5; white-space: pre; pointer-events: none;
      }
      #help {
        position: fixed; bottom: 8px; left: 8px; z-index: 10;
        color: #7f95b4; font-size: 12px; line-height: 1.6; white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="desktop-hud">booting...</div>
    <div id="help">drag = look   click = measure   WASD = walk   hold ↑ = teleport, release = go   F = fly mode   arrows = snap turn   H = hud   U = unstick   [ ] = LOD detail   T = terrain tuner</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
