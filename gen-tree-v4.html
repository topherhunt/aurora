<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gen-tree-v4 -- fringed pine</title>
<style>
  :root {
    --panel: rgba(8, 14, 26, .88);
    --edge: #2b4a72;
    --ink: #cfe3ff;
    --dim: #7f96b8;
    --good: #6fbf73;
    --warn: #c9a227;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05090f; color: var(--ink);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; }

  /* The knobs scroll; the footer is pinned, so the view buttons never sit
     under thirty sliders. */
  #panel { width: 316px; flex: none; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--edge); }
  #knobs { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 10px; }
  #footer { flex: none; padding: 8px 12px; border-top: 1px solid var(--edge); background: var(--panel); }
  .head { margin: 14px 0 6px; padding-bottom: 3px; color: var(--good);
    border-bottom: 1px solid var(--edge); text-transform: uppercase; letter-spacing: .08em; }
  .row { display: grid; grid-template-columns: 106px 1fr 46px; align-items: center; gap: 6px; margin: 3px 0; }
  .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row:hover label { color: var(--ink); }
  .row input { width: 100%; }
  .val { text-align: right; color: var(--warn); }

  .species { width: 100%; margin: 4px 0 2px; font: inherit; color: var(--ink);
    background: #10203a; border: 1px solid var(--edge); border-radius: 3px; padding: 3px 6px; }
  .buttons { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .buttons button { font: inherit; color: var(--ink); background: #10203a;
    border: 1px solid var(--edge); border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .buttons button:hover { background: #1b355c; }
  .buttons button.on { color: #05090f; background: var(--good); border-color: var(--good); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .cell-label { position: absolute; color: var(--ink); background: rgba(5, 9, 15, .62);
    padding: 1px 4px; font-size: 11px; text-align: center; }
  #stats { flex: none; padding: 4px 8px; color: var(--warn); border-top: 1px solid var(--edge);
    background: var(--panel); }

  /* ?shot= strips the chrome so a headless capture is all picture. */
  body.shot #panel, body.shot #stats { display: none; }
</style>
</head>
<body>
  <div id="panel"></div>
  <div id="main">
    <div id="stage"><div id="labels"></div></div>
    <div id="stats"></div>
  </div>
  <script type="module" src="/src/gen-tree-v4-main.js"></script>
</body>
</html>
