<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test-flare</title>
    <style>
      :root { --panel: rgba(8,14,26,.88); --edge: #2b4a72; --ink: #cfe3ff; --dim: #7f96b8; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: #05080f; color: var(--ink); font: 12px/1.5 monospace; display: flex; }
      canvas { display: block; }
      h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: normal; }
      h2:not(:first-child) { margin-top: 14px; border-top: 1px solid #1b2c44; padding-top: 10px; }
      input, button { font: inherit; color: var(--ink); background: #0e1726; border: 1px solid var(--edge); border-radius: 3px; padding: 3px 5px; min-width: 0; }
      button { cursor: pointer; }
      button:hover { background: #17263c; }
      button.on { background: #1d3a5f; border-color: #4a7fbf; color: #eaf3ff; }
      #panel { flex: 0 0 300px; display: flex; flex-direction: column; border-right: 1px solid var(--edge); background: var(--panel); }
      #panel > header { padding: 8px 10px; border-bottom: 1px solid #1b2c44; }
      #panel > header .t { color: #eaf3ff; letter-spacing: .06em; }
      #panel > header .s { color: var(--dim); font-size: 11px; }
      #controls { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px; }
      .row { display: grid; grid-template-columns: 84px 1fr 46px; gap: 6px; align-items: center; margin-bottom: 3px; }
      .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
      .row input[type=range] { width: 100%; padding: 0; background: none; border: none; }
      .row .v { text-align: right; font-variant-numeric: tabular-nums; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
      .chips button { font-size: 11px; padding: 2px 6px; }
      .chips button.swatch { width: 26px; height: 20px; }
      #buttons { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-top: 1px solid #1b2c44; }
      #buttons button { flex: 1 1 auto; padding: 4px 6px; }
      #stage { flex: 1 1 auto; position: relative; min-width: 0; }
      #hint { position: absolute; left: 10px; top: 10px; color: var(--dim); pointer-events: none; }
      #readout { position: absolute; right: 10px; top: 10px; color: var(--dim); pointer-events: none; text-align: right; white-space: pre; }
      #err { position: absolute; left: 10px; bottom: 10px; color: #ff7b6b; white-space: pre-wrap; max-width: 60%; }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <div class="t">FLARE</div>
        <div class="s">the flare gun's flare (v2/render/flares.js), hanging over the ground</div>
      </header>
      <div id="controls">
        <h2>colour</h2>
        <div id="swatches" class="chips qa-flare-swatches"></div>
        <h2>view from</h2>
        <div id="ranges" class="chips qa-flare-ranges"></div>
        <div id="sliders"></div>
      </div>
      <div id="buttons">
        <button id="fire" class="qa-flare-fire" title="shoot a fresh flare from beside the camera to the hanging one's spot (space)">fire</button>
        <button id="pause" class="qa-flare-pause">pause</button>
        <button id="reset" class="qa-flare-reset">defaults</button>
        <button id="copy" class="qa-flare-copy" title="the look as a FLARE object literal, to the clipboard">copy</button>
      </div>
    </div>
    <div id="stage"><div id="hint">drag to orbit &middot; scroll to zoom &middot; space fires</div><div id="readout"></div><div id="err"></div></div>
    <script type="module" src="/src/test-flare-main.js"></script>
  </body>
</html>
