<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora v2</title>
    <!-- Loaded before main.js (like quest.html), which injects the live
         <a-scene> that owns the renderer and the XR session. -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e16; }
      body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0a0e16; color: #7f95b4; z-index: 100; transition: opacity .35s;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot b { color: #7fd1ff; font-weight: 600; }
      #boot pre { color: #ff9a7a; max-width: 70ch; white-space: pre-wrap; }
      #boot-sub { color: #4f627d; max-width: 70ch; text-align: center; margin-top: .5em; }
      #boot-sub b { color: #7f95b4; }
    </style>
  </head>
  <body>
    <div id="boot"><div><div id="boot-line">loading <b>world/height.png</b> ...</div><div id="boot-sub"></div></div></div>
    <div id="v2-panel"></div>
    <script type="module" src="/src/v2/main.js"></script>
  </body>
</html>
