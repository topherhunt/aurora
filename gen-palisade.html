<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora -- palisade post</title>
    <style>
      :root { --panel: rgba(8,14,26,.88); --edge: #2b4a72; --ink: #cfe3ff; --dim: #7f96b8; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: #05080f; color: var(--ink); font: 12px/1.5 monospace; display: flex; }
      canvas { display: block; }
      h2 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: normal; border-top: 1px solid #1b2c44; padding-top: 10px; }
      h2:first-child { margin-top: 0; border-top: none; padding-top: 0; }
      input, button { font: inherit; color: var(--ink); background: #0e1726; border: 1px solid var(--edge); border-radius: 3px; padding: 3px 5px; min-width: 0; }
      button { cursor: pointer; }
      button:hover { background: #17263c; }
      button.on { background: #1d3a5f; border-color: #4a7fbf; color: #eaf3ff; }
      #panel { flex: 0 0 280px; display: flex; flex-direction: column; border-right: 1px solid var(--edge); background: var(--panel); }
      #panel > header { padding: 8px 10px; border-bottom: 1px solid #1b2c44; }
      #panel > header .t { color: #eaf3ff; letter-spacing: .06em; }
      #panel > header .s { color: var(--dim); font-size: 11px; }
      #controls { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px; }
      .pick { display: flex; gap: 6px; margin-bottom: 6px; }
      .pick input { flex: 1 1 auto; }
      #buttons { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-top: 1px solid #1b2c44; }
      #buttons button { flex: 1 1 auto; padding: 4px 6px; }
      #stage { flex: 1 1 auto; position: relative; min-width: 0; }
      #hint { position: absolute; left: 10px; top: 10px; color: var(--dim); pointer-events: none; }
      #stats { position: absolute; right: 10px; top: 10px; pointer-events: none; padding: 6px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 3px; }
      table { border-collapse: collapse; }
      td { padding: 0 0 0 10px; }
      td:first-child { padding: 0; color: var(--dim); }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      .legend { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <div class="t">PALISADE POST</div>
        <div class="s">LOD0, LOD1 and the card, and a run of wall</div>
      </header>
      <div id="controls">
        <h2>post</h2>
        <div class="pick">
          <input type="number" id="seed" class="qa-seed" value="1" min="0" step="1" />
          <button id="reroll" class="qa-reroll">reroll</button>
        </div>
        <h2>row, left to right</h2>
        <div class="legend">LOD0 (9 sides, 5 segments) &middot; LOD1 (7 sides, 1 segment) &middot; card (the shared pool's picture) &middot; then a curved wall of LOD0 posts with its entrance torches</div>
      </div>
      <div id="buttons">
        <button id="night" class="qa-night">night</button>
        <button id="wire" class="qa-wire">wireframe</button>
        <button id="spin" class="qa-spin">spin</button>
      </div>
    </div>
    <div id="stage">
      <div id="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
      <div id="stats"><table id="statsTable" class="qa-stats"></table></div>
    </div>
    <script type="module" src="/src/gen-palisade-main.js"></script>
  </body>
</html>
