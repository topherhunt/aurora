<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gen-tree-v7 -- spray pine</title>
<style>
  :root {
    --panel: rgba(8, 14, 26, .88);
    --edge: #2b4a72;
    --ink: #cfe3ff;
    --dim: #7f96b8;
    --good: #6fbf73;
    --warn: #c9a227;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05090f; color: var(--ink);
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; }

  /* The panel is a column: params scroll, the button bar is pinned under them. */
  #panel { width: 316px; flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--edge); }
  #params { flex: 1; overflow-y: auto; min-height: 0; padding: 10px 12px 16px; }
  .head { margin: 14px 0 6px; padding-bottom: 3px; color: var(--good);
    border-bottom: 1px solid var(--edge); text-transform: uppercase; letter-spacing: .08em; }
  .row { display: grid; grid-template-columns: 106px 1fr 46px; align-items: center; gap: 6px; margin: 3px 0; }
  .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row:hover label { color: var(--ink); }
  /* Moved off the value it loaded with -- the whole point is to see, at a
     glance, which knobs are yours and which are still the file's. */
  .row.dirty label { color: var(--warn); font-weight: 700; }
  .row input { width: 100%; }
  .val { text-align: right; color: var(--warn); }

  .buttons { flex: none; display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    padding: 8px 12px; border-top: 1px solid var(--edge); }
  .buttons button { font: inherit; color: var(--ink); background: #10203a;
    border: 1px solid var(--edge); border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .buttons button:hover { background: #1b355c; }
  .buttons .note { color: var(--dim); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #stats { flex: none; padding: 4px 8px; color: var(--warn); border-top: 1px solid var(--edge);
    background: var(--panel); }

  /* ?shot= strips the chrome so a headless capture is all picture. */
  body.shot #panel, body.shot #stats { display: none; }
</style>
</head>
<body>
  <div id="panel">
    <div id="params"></div>
    <div class="buttons" id="buttons"></div>
  </div>
  <div id="main">
    <div id="stage"></div>
    <div id="stats"></div>
  </div>
  <script type="module" src="/src/gen-tree-v7-main.js"></script>
</body>
</html>
