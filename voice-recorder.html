<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora -- voice recorder</title>
    <style>
      :root { --panel: #0a1220; --edge: #2b4a72; --ink: #cfe3ff; --dim: #7f96b8; --accent: #7fd1ff; --rec: #ff5a5a; --ok: #6fdc8c; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: #05080f; color: var(--ink); font: 13px/1.5 monospace; display: flex; overflow: hidden; }
      h2 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: normal; }
      h2:first-child { margin-top: 0; }
      button, select { font: inherit; color: var(--ink); background: #0e1726; border: 1px solid var(--edge); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
      button:hover { background: #17263c; }
      button[aria-pressed="true"] { background: #1d3a5c; border-color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; }
      label { display: block; margin: 4px 0; color: var(--dim); }
      select { width: 100%; }
      kbd { border: 1px solid var(--edge); border-radius: 3px; padding: 0 4px; color: var(--ink); }

      #side { width: 290px; padding: 14px; background: var(--panel); border-right: 1px solid #1b2c44; overflow-y: auto; flex: none; }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #stage { padding: 18px 24px; border-bottom: 1px solid #1b2c44; background: var(--panel); }
      #list { flex: 1; overflow-y: auto; padding: 8px 24px 40px; }

      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .row > * { flex: 1; }
      .note { color: var(--dim); font-size: 12px; }
      .err { color: var(--rec); white-space: pre-wrap; }

      #cur-meta { color: var(--dim); font-size: 12px; }
      #cur-text { font-size: 30px; line-height: 1.2; margin: 6px 0 2px; font-family: Georgia, serif; }
      #cur-note { color: var(--accent); font-style: italic; }
      #wave { width: 100%; height: 90px; display: block; margin-top: 12px; background: #070d18; border: 1px solid #1b2c44; border-radius: 3px; }
      #meter { height: 6px; background: #070d18; margin-top: 6px; border-radius: 3px; overflow: hidden; }
      #meter > div { height: 100%; width: 0; background: var(--ok); }
      #status { margin-top: 8px; min-height: 1.5em; }
      body.recording #stage { box-shadow: inset 4px 0 0 var(--rec); }
      body.recording #status { color: var(--rec); }

      .atom { margin-top: 14px; }
      .atom-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
      .atom-id { color: var(--accent); }
      .badge { font-size: 11px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--edge); color: var(--dim); }
      .badge.core { border-color: var(--accent); color: var(--accent); }
      .mood-warm { color: #ffcf7f; } .mood-cold { color: #9fb7d9; } .mood-angry { color: #ff8a7a; } .mood-distress { color: #ff7ab8; }
      .tier { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 0 4px; }
      .line { display: flex; gap: 10px; padding: 3px 6px; border-radius: 3px; cursor: pointer; align-items: baseline; }
      .line:hover { background: #0e1726; }
      .line.sel { background: #1d3a5c; }
      .line .dots { width: 52px; flex: none; letter-spacing: 2px; }
      .line .dots span { color: #26364e; }
      .line.sel .dots span { color: #4a6a94; }
      .line .dots span.have { color: var(--ok); }
      .line .text { font-family: Georgia, serif; font-size: 15px; }
      .line .lnote { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="side">
      <h2>Microphone</h2>
      <button id="mic-on" class="qa-mic-on">Enable microphone</button>
      <label>Input <select id="mic-sel" class="qa-mic-sel"></select></label>
      <div class="note">Echo cancel, noise suppression and auto gain are off: they are tuned for calls and smear a voice.</div>

      <h2>Save folder</h2>
      <button id="folder" class="qa-folder">Choose folder...</button>
      <div id="folder-name" class="note">None: takes download instead. Suggested: tools/voice/work/</div>

      <h2>Take</h2>
      <select id="take" class="qa-take"></select>
      <label>Playback rate <select id="rate" class="qa-rate">
        <option>0.8</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
      </select></label>
      <label><input type="checkbox" id="autoplay" checked /> Play back after each take</label>

      <h2>Show</h2>
      <div class="row">
        <button id="set-human" class="qa-set-human" aria-pressed="true">Human</button>
        <button id="set-leafkin" class="qa-set-leafkin" aria-pressed="false">Leafkin</button>
      </div>
      <label>Category <select id="cat" class="qa-cat"></select></label>
      <label><input type="checkbox" id="core-only" /> Core atoms only</label>
      <div id="counts" class="note qa-counts"></div>

      <h2>Keys</h2>
      <div class="note">
        <kbd>Space</kbd> record / stop<br />
        <kbd>Enter</kbd> play the take<br />
        <kbd>&darr;</kbd> <kbd>&uarr;</kbd> next / previous line<br />
        <kbd>1</kbd>-<kbd>4</kbd> pick a take
      </div>

      <h2>Leafkin words</h2>
      <div id="lk-words" class="note"></div>
    </div>

    <div id="main">
      <div id="stage">
        <div id="cur-meta" class="qa-cur-meta"></div>
        <div id="cur-text" class="qa-cur-text"></div>
        <div id="cur-note" class="qa-cur-note"></div>
        <canvas id="wave"></canvas>
        <div id="meter"><div></div></div>
        <div id="status" class="qa-status"></div>
      </div>
      <div id="list" class="qa-list"></div>
    </div>

    <script type="module">
      import { HUMAN, LEAFKIN, LEAFKIN_WORDS, TIERS, TAKES } from './tools/voice/atoms.js'
      import { cleanTake, encodeWav, fileName } from './tools/voice/audio.js'

      const $ = (id) => document.getElementById(id)

      // Every recordable line, flattened: { set, atom, variant, text, note, tier }.
      const LINES = {
        human: HUMAN.flatMap((atom) => atom.lines.map(([text, note], i) => ({ set: 'human', atom, variant: String(i + 1), text, note, tier: null }))),
        leafkin: LEAFKIN.flatMap((atom) => TIERS.flatMap((tier) => atom.tiers[tier].map(([text, note], i) => ({ set: 'leafkin', atom, variant: `${tier}-${i + 1}`, text, note, tier })))),
      }

      const st = {
        set: 'human', cat: 'all', coreOnly: false, take: TAKES[0].id, sel: 0,
        ctx: null, stream: null, src: null, analyser: null, node: null,
        recording: false, chunks: [], dir: null,
        have: new Set(), // file names on disk (or downloaded this session)
        buffers: new Map(), // file name -> AudioBuffer, for playback
      }

      const shown = () => LINES[st.set].filter((l) => (st.cat === 'all' || l.atom.cat === st.cat) && (!st.coreOnly || l.atom.core))
      const current = () => shown()[st.sel]

      // --- ui --------------------------------------------------------------

      for (const [i, t] of TAKES.entries()) $('take').add(new Option(`${i + 1}. ${t.label}`, t.id))
      $('lk-words').innerHTML = LEAFKIN_WORDS.map(([w, m]) => `<b>${w}</b> ${m}`).join('<br>')

      function fillCats() {
        const cats = [...new Set(LINES[st.set].map((l) => l.atom.cat))]
        $('cat').replaceChildren(new Option('all', 'all'), ...cats.map((c) => new Option(c, c)))
        st.cat = 'all'
      }

      function render() {
        const lines = shown()
        st.sel = Math.min(st.sel, lines.length - 1)
        const list = $('list')
        list.replaceChildren()
        let atomEl = null
        let lastAtom = null
        let lastTier = null
        lines.forEach((l, i) => {
          if (l.atom !== lastAtom) {
            atomEl = document.createElement('div')
            atomEl.className = 'atom qa-atom'
            atomEl.innerHTML = `<div class="atom-head"><span class="atom-id">${l.atom.id}</span>` +
              `<span class="badge ${l.atom.core ? 'core' : ''}">${l.atom.core ? 'core' : 'extra'}</span>` +
              `<span class="mood-${l.atom.mood}">${l.atom.mood}</span><span class="note">${l.atom.when}</span></div>`
            list.append(atomEl)
            lastAtom = l.atom
            lastTier = null
          }
          if (l.tier !== null && l.tier !== lastTier) {
            const t = document.createElement('div')
            t.className = 'tier'
            t.textContent = l.tier
            atomEl.append(t)
            lastTier = l.tier
          }
          const row = document.createElement('div')
          row.className = `line qa-line${i === st.sel ? ' sel' : ''}`
          const dots = TAKES.map((t) => `<span class="${st.have.has(fileName(l.atom.id, l.variant, t.id)) ? 'have' : ''}" title="${t.label}">&#9679;</span>`).join('')
          row.innerHTML = `<span class="dots">${dots}</span><span class="text"></span><span class="lnote"></span>`
          row.querySelector('.text').textContent = l.text
          row.querySelector('.lnote').textContent = l.note
          row.onclick = () => select(i)
          atomEl.append(row)
        })
        const all = LINES[st.set]
        const done = all.filter((l) => st.have.has(fileName(l.atom.id, l.variant, st.take))).length
        const atoms = new Set(all.map((l) => l.atom.id)).size
        $('counts').textContent = `${atoms} atoms, ${all.length} lines; ${done} recorded in this take`
        showCurrent()
      }

      function showCurrent() {
        const l = current()
        if (!l) { $('cur-text').textContent = '(nothing shown)'; return }
        $('cur-meta').textContent = `${l.atom.id}  ${l.variant}  ·  ${l.atom.when}  ·  take: ${st.take}`
        $('cur-text').textContent = l.text
        $('cur-note').textContent = l.note
        drawWave(st.buffers.get(fileName(l.atom.id, l.variant, st.take)) ?? null)
      }

      function select(i) {
        if (st.recording) return
        st.sel = Math.max(0, Math.min(shown().length - 1, i))
        render()
        document.querySelector('.line.sel')?.scrollIntoView({ block: 'nearest' })
      }

      function status(text, err = false) {
        $('status').textContent = text
        $('status').className = err ? 'err qa-status' : 'qa-status'
      }

      function drawWave(buf) {
        const c = $('wave')
        c.width = c.clientWidth * devicePixelRatio
        c.height = c.clientHeight * devicePixelRatio
        const g = c.getContext('2d')
        g.clearRect(0, 0, c.width, c.height)
        if (buf === null) return
        const d = buf.getChannelData(0)
        const mid = c.height / 2
        g.fillStyle = '#7fd1ff'
        const per = d.length / c.width
        for (let x = 0; x < c.width; x++) {
          let hi = 0
          for (let j = Math.floor(x * per); j < Math.floor((x + 1) * per); j++) hi = Math.max(hi, Math.abs(d[j]))
          g.fillRect(x, mid - hi * mid, 1, Math.max(1, hi * c.height))
        }
        g.fillStyle = '#7f96b8'
        g.font = `${11 * devicePixelRatio}px monospace`
        g.fillText(`${buf.duration.toFixed(2)} s`, 6 * devicePixelRatio, 14 * devicePixelRatio)
      }

      // --- microphone ------------------------------------------------------

      // The worklet hands raw float blocks to the page, so takes are lossless PCM (MediaRecorder only gives lossy codecs).
      const WORKLET = `registerProcessor('tap', class extends AudioWorkletProcessor {
        process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true }
      })`

      async function enableMic(deviceId) {
        if (st.stream) st.stream.getTracks().forEach((t) => t.stop())
        st.stream = await navigator.mediaDevices.getUserMedia({ audio: {
          deviceId: deviceId ? { exact: deviceId } : undefined, channelCount: 1,
          echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        } })
        if (st.ctx === null) {
          st.ctx = new AudioContext()
          await st.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })))
          st.node = new AudioWorkletNode(st.ctx, 'tap')
          st.node.port.onmessage = (e) => { if (st.recording) st.chunks.push(e.data) }
          st.analyser = st.ctx.createAnalyser()
          st.analyser.fftSize = 1024
          meterLoop()
        }
        st.src?.disconnect()
        st.src = st.ctx.createMediaStreamSource(st.stream)
        st.src.connect(st.analyser)
        st.src.connect(st.node)
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput')
        const active = st.stream.getAudioTracks()[0].getSettings().deviceId
        $('mic-sel').replaceChildren(...devices.map((d) => new Option(d.label || d.deviceId, d.deviceId, false, d.deviceId === active)))
        $('mic-on').textContent = 'Microphone on'
        $('mic-on').disabled = true
        status(`Mic ready at ${st.ctx.sampleRate} Hz. Space to record.`)
      }

      function meterLoop() {
        const data = new Float32Array(st.analyser.fftSize)
        const tick = () => {
          st.analyser.getFloatTimeDomainData(data)
          let peak = 0
          for (const v of data) peak = Math.max(peak, Math.abs(v))
          const bar = $('meter').firstElementChild
          bar.style.width = `${Math.min(100, peak * 100)}%`
          bar.style.background = peak > 0.98 ? 'var(--rec)' : peak > 0.7 ? '#ffcf7f' : 'var(--ok)'
          requestAnimationFrame(tick)
        }
        tick()
      }

      // --- recording -------------------------------------------------------

      function startTake() {
        if (st.ctx === null) { status('Enable the microphone first.', true); return }
        if (!current()) return
        st.ctx.resume()
        st.chunks = []
        st.recording = true
        document.body.classList.add('recording')
        status('Recording... Space to stop.')
      }

      async function stopTake() {
        st.recording = false
        document.body.classList.remove('recording')
        const total = st.chunks.reduce((n, c) => n + c.length, 0)
        const raw = new Float32Array(total)
        let o = 0
        for (const c of st.chunks) { raw.set(c, o); o += c.length }
        const rate = st.ctx.sampleRate
        const clean = cleanTake(raw, rate)
        if (clean === null) { status('Nothing above the noise gate: is the mic muted or too far?', true); return }
        const l = current()
        const name = fileName(l.atom.id, l.variant, st.take)
        const buf = st.ctx.createBuffer(1, clean.length, rate)
        buf.copyToChannel(clean, 0)
        st.buffers.set(name, buf)
        await save(name, encodeWav(clean, rate))
        st.have.add(name)
        render()
        status(`Saved ${name} (${buf.duration.toFixed(2)} s).`)
        if ($('autoplay').checked) play()
      }

      function play() {
        const l = current()
        if (!l || st.ctx === null) return
        const buf = st.buffers.get(fileName(l.atom.id, l.variant, st.take))
        if (!buf) { status('No take for this line yet.'); return }
        st.ctx.resume()
        const s = st.ctx.createBufferSource()
        s.buffer = buf
        // An AudioBufferSourceNode's rate moves pitch and formants together: exactly the leafkin shift.
        s.playbackRate.value = Number($('rate').value)
        s.connect(st.ctx.destination)
        s.start()
      }

      // --- files: a chosen folder (Chromium) or downloads ------------------

      async function save(name, wav) {
        const blob = new Blob([wav], { type: 'audio/wav' })
        if (st.dir === null) {
          const a = document.createElement('a')
          a.href = URL.createObjectURL(blob)
          a.download = name
          a.click()
          return
        }
        const fh = await st.dir.getFileHandle(name, { create: true })
        const w = await fh.createWritable()
        await w.write(blob)
        await w.close()
      }

      // The chosen folder survives a reload in IndexedDB; the browser still asks again for write permission.
      const idb = () => new Promise((ok, fail) => {
        const r = indexedDB.open('voice-recorder', 1)
        r.onupgradeneeded = () => r.result.createObjectStore('kv')
        r.onsuccess = () => ok(r.result)
        r.onerror = () => fail(r.error)
      })
      async function kv(key, value) {
        const db = await idb()
        return new Promise((ok, fail) => {
          const tx = db.transaction('kv', value === undefined ? 'readonly' : 'readwrite')
          const r = value === undefined ? tx.objectStore('kv').get(key) : tx.objectStore('kv').put(value, key)
          r.onsuccess = () => ok(r.result)
          r.onerror = () => fail(r.error)
        })
      }

      async function useFolder(dir) {
        if ((await dir.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') {
          throw new Error('Write permission to the folder was refused.')
        }
        st.dir = dir
        await kv('dir', dir)
        st.have.clear()
        st.buffers.clear()
        const decoder = st.ctx ?? new AudioContext()
        let n = 0
        for await (const [name, h] of dir.entries()) {
          if (h.kind !== 'file' || !name.endsWith('.wav')) continue
          st.have.add(name)
          st.buffers.set(name, await decoder.decodeAudioData(await (await h.getFile()).arrayBuffer()))
          n++
        }
        $('folder-name').textContent = `${dir.name}/ (${n} takes found)`
        $('folder').textContent = 'Change folder...'
        render()
      }

      $('folder').onclick = async () => {
        if (!('showDirectoryPicker' in window)) { status('This browser cannot write to a folder; takes will download instead. Use Chrome for folder saving.', true); return }
        const saved = await kv('dir')
        if (saved && st.dir === null) {
          try { await useFolder(saved); return } catch (e) { console.warn(e) }
        }
        try { await useFolder(await showDirectoryPicker({ id: 'voice-recorder', mode: 'readwrite' })) } catch (e) {
          if (e.name !== 'AbortError') status(String(e), true)
        }
      }

      // --- wiring ----------------------------------------------------------

      $('mic-on').onclick = () => enableMic().catch((e) => status(`Microphone: ${e.message}`, true))
      $('mic-sel').onchange = () => enableMic($('mic-sel').value).catch((e) => status(`Microphone: ${e.message}`, true))
      function setTake(id) {
        st.take = id
        $('take').value = id
        $('rate').value = String(TAKES.find((t) => t.id === id).rate)
        render()
      }
      $('take').onchange = () => setTake($('take').value)
      $('cat').onchange = () => { st.cat = $('cat').value; st.sel = 0; render() }
      $('core-only').onchange = () => { st.coreOnly = $('core-only').checked; st.sel = 0; render() }
      for (const set of ['human', 'leafkin']) {
        $(`set-${set}`).onclick = () => {
          st.set = set
          st.sel = 0
          $('set-human').setAttribute('aria-pressed', set === 'human')
          $('set-leafkin').setAttribute('aria-pressed', set === 'leafkin')
          fillCats()
          if (set === 'leafkin' && st.take !== 'leafkin') setTake('leafkin')
          else render()
        }
      }

      addEventListener('keydown', (e) => {
        if (e.target instanceof HTMLSelectElement || e.metaKey || e.ctrlKey) return
        // A focused button would also take the Space as a click.
        if (document.activeElement instanceof HTMLButtonElement) document.activeElement.blur()
        if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) Promise.resolve(st.recording ? stopTake() : startTake()).catch((err) => status(String(err), true)) }
        else if (st.recording) return
        else if (e.code === 'Enter') { e.preventDefault(); play() }
        else if (e.code === 'ArrowDown') { e.preventDefault(); select(st.sel + 1) }
        else if (e.code === 'ArrowUp') { e.preventDefault(); select(st.sel - 1) }
        else if (/^Digit[1-4]$/.test(e.code)) setTake(TAKES[Number(e.code.slice(5)) - 1].id)
      })
      addEventListener('resize', showCurrent)

      fillCats()
      render()
      kv('dir').then((d) => { if (d) { $('folder-name').textContent = `${d.name}/ (click to reconnect)`; $('folder').textContent = 'Reconnect folder...' } })
    </script>
  </body>
</html>
