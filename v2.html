<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora v2 -- world editor</title>
    <style>
      /* Only the page shell lives here. The panel builds its own DOM and brings
         its own styles (src/v2/ui/panel.js), because it is a component with
         state and splitting its look away from its behaviour across two files
         is how the v1 HUD ended up with markup in index.html that nothing
         referenced any more. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e16; }
      body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe3ff; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0a0e16; color: #7f95b4; z-index: 100; transition: opacity .35s;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot b { color: #7fd1ff; font-weight: 600; }
      #boot pre { color: #ff9a7a; max-width: 70ch; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="boot"><span>loading <b>world/height.png</b> ...</span></div>
    <div id="v2-panel"></div>
    <script type="module" src="/src/v2/main.js"></script>
  </body>
</html>
