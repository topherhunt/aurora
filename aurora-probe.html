<!doctype html>
<!--
  Throwaway compile-and-render probe for the aurora lab, driven by
  scratchpad/probe.sh under headless Chrome + SwiftShader. It exists to answer
  the one question static analysis cannot: does the assembled fragment shader
  actually LINK on a real WebGL2 context, for every algorithm and for every
  branch configuration the new cost gates introduced.

  Not part of the app. Delete it when the lab is done.
-->
<meta charset="utf-8">
<title>aurora probe</title>
<style>body{background:#000;color:#ccc;font:12px monospace}canvas{display:none}</style>
<div id="out">running</div>
<div id="shots"></div>
<script type="module">
import * as THREE from 'three'
import { AuroraScreen } from '/src/aurora-lab/screen.js'
import { LowResAurora } from '/src/aurora-lab/lowres.js'
import { ALGORITHMS, defaultsFor } from '/src/aurora-lab/algorithms.js'
import { BUILTIN_PRESETS } from '/src/aurora-lab/presets.js'

const lines = []
const say = (s, extra) => {
  lines.push(extra ? s + '   ' + extra : s)
  document.getElementById('out').textContent = lines.join('\n')
}

const canvas = document.createElement('canvas')
canvas.width = 480; canvas.height = 300
document.body.appendChild(canvas)

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(480, 300, false)

let shaderErrors = 0
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  shaderErrors++
  say('SHADER ERROR: ' + gl.getProgramInfoLog(prog))
  say('  vs: ' + gl.getShaderInfoLog(vs))
  say('  fs: ' + (gl.getShaderInfoLog(fs) || '').split('\n').slice(0, 12).join('\n      '))
}

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(62, 480 / 300, 0.1, 40000)
camera.position.set(0, 2, 0)
camera.rotation.order = 'YXZ'
// A three camera looks down -z with no rotation at all, and -z is north, so
// this is already pointing at the belt. Turning it to Math.PI faces SOUTH,
// where the sector now draws nothing -- which is a fine test and a useless
// screenshot.
camera.rotation.y = 0
camera.rotation.x = 0.30

const screen = new AuroraScreen(scene, { algorithm: 'leyline' })

function frame(t) {
  screen.update(camera, t)
  renderer.render(scene, camera)
}

// A frame is what forces the link, so every configuration below is rendered.
function trial(label, algo, overrides, t) {
  const before = shaderErrors
  screen.setAlgorithm(algo)
  screen.setValues({ ...defaultsFor(algo), ...overrides })
  frame(t)
  say((shaderErrors === before ? '  ok   ' : ' FAIL  ') + label)
}

// ---- every algorithm, at both warp stage counts
for (const a of ALGORITHMS) {
  trial(a.id + ' @ warpStages 2', a.id, { warpStages: 2 }, 3.0)
  trial(a.id + ' @ warpStages 1', a.id, { warpStages: 1 }, 3.0)
}

// ---- every gate on, and every gate off. Both bodies of every uniform-valued
// branch have to compile, and the all-off path is the one nothing else covers.
trial('all optional terms ON', 'leyline',
  { rays: 0.6, flowHue: 1, caustic: 0.5, beltAmt: 0.85, leyBend: 0.85, leyGateAmt: 0.7, leyPatchAmt: 0.55 }, 3.0)
trial('all optional terms OFF', 'leyline',
  { rays: 0, flowHue: 0, caustic: 0, beltAmt: 0, leyBend: 0, leyGateAmt: 0, leyPatchAmt: 0 }, 3.0)

// ---- belt extremes, which used to have their own early-out and no longer do
trial('belt overhead (offset 0)', 'leyline', { beltOffset: 0, beltWidth: 100 }, 3.0)
trial('belt far out (offset -1500)', 'leyline', { beltOffset: -1500, beltWidth: 60 }, 3.0)

// ---- facing south must draw nothing at all now, which is the sector working
{
  screen.setAlgorithm('leyline')
  screen.setValues(defaultsFor('leyline'))
  camera.rotation.y = Math.PI
  frame(6.0)
  const gl = renderer.getContext()
  const px = new Uint8Array(480 * 300 * 4)
  gl.readPixels(0, 0, 480, 300, gl.RGBA, gl.UNSIGNED_BYTE, px)
  let lit = 0
  for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 6) lit++
  say((lit === 0 ? '  ok   ' : ' FAIL  ') + 'facing south draws no aurora at all', lit + ' lit px')
  camera.rotation.y = 0
}

// ---- step-count sweep, to pick the fast tier's floor by looking rather than
// by guessing. The dither turns banding into per-pixel noise, so what fails at
// a low step count is not shells, it is GRAIN -- and grain is the thing that
// fizzes in a headset. Measured as the mean absolute difference between a pixel
// and its right-hand neighbour over the lit part of the frame: structure is
// smooth at this scale, so anything above the reference's figure is noise.
{
  const fast = BUILTIN_PRESETS.find(p => p.name === 'fast')
  const gl = renderer.getContext()
  const px = new Uint8Array(480 * 300 * 4)
  const grain = () => {
    gl.readPixels(0, 0, 480, 300, gl.RGBA, gl.UNSIGNED_BYTE, px)
    let sum = 0, n = 0
    for (let y = 0; y < 300; y++) {
      for (let x = 0; x < 479; x++) {
        const i = (y * 480 + x) * 4
        if (px[i] + px[i + 1] + px[i + 2] < 12) continue
        sum += Math.abs(px[i + 1] - px[i + 5])
        n++
      }
    }
    return n ? sum / n : 0
  }
  say('')
  screen.setAlgorithm('leyline')
  for (const [label, vals] of [
    ['reference-v1 (40 steps, 2 warp stages)', BUILTIN_PRESETS.find(p => p.name === 'reference-v1').values],
    ['fast @ 12', { ...fast.values, steps: 12 }],
    ['fast @ 16', { ...fast.values, steps: 16 }],
    ['fast @ 20', { ...fast.values, steps: 20 }],
    ['fast @ 24', { ...fast.values, steps: 24 }],
    ['fast @ 32', { ...fast.values, steps: 32 }],
  ]) {
    screen.setValues(vals)
    frame(6.0)
    say('  grain ' + grain().toFixed(2) + '   ' + label)
  }
}

const shots = document.getElementById('shots')
function capture(name) {
  const d = document.createElement('div')
  d.className = 'shot'
  d.dataset.algo = name
  d.textContent = canvas.toDataURL('image/png')
  shots.appendChild(d)
}

// ---- a picture of every algorithm at its own defaults. The cheap candidates
// are only worth having if they still read as an aurora, and that is not a
// question any assertion in this file can answer -- so the probe's job is to
// produce the frames and get out of the way.
for (const a of ALGORITHMS) {
  screen.setAlgorithm(a.id)
  screen.setValues(defaultsFor(a.id))
  frame(6.0)
  capture('algo-' + a.id)
}

// ---- the shipped presets, and a picture of each
for (const p of BUILTIN_PRESETS) {
  const before = shaderErrors
  screen.setAlgorithm(p.algorithm)
  screen.setValues(p.values)
  frame(6.0)
  say((shaderErrors === before ? '  ok   ' : ' FAIL  ') + 'preset ' + p.name)
  capture(p.name)
}

// ---- how much of the sky the northern sector removes. Counted over
// directions rather than timed, so it is a geometric fact and not a benchmark:
// it is the fraction of the sky that can still produce an aurora fragment.
{
  let inSector = 0, total = 0
  const N = 240
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const az = (i / N) * 2 * Math.PI - Math.PI
      const elDeg = (j / N) * 90
      total++
      if (Math.abs(az) * 180 / Math.PI > 100 || elDeg > 78) continue
      inSector++
    }
  }
  say('')
  say('sky directions above the horizon: ' + total)
  say('  inside the northern sector:     ' + inSector + '  (' + (100 * inSector / total).toFixed(1) + '%)')
}

// ---- the low-res composite, which is the one shader in the lab that nothing
// else here ever links. It is a different program from the raymarch -- its own
// material, its own colorspace_fragment include, a loop whose bounds come from
// a `defines` constant -- so a typo in it would otherwise surface as a black
// sky the first time somebody moved the divisor off 1.
{
  const lowres = new LowResAurora(renderer, screen)
  scene.add(lowres.mesh)
  lowres.setSize(480, 300)
  screen.setAlgorithm('leyline')
  screen.setValues(defaultsFor('leyline'))
  say('')
  const gl = renderer.getContext()
  const px = new Uint8Array(480 * 300 * 4)
  for (const [div, blur] of [[1, 1.0], [2, 1.0], [4, 1.0], [4, 0.0], [6, 1.5], [10, 3.0]]) {
    const before = shaderErrors
    lowres.setDiv(div)
    lowres.setBlur(blur)
    screen.update(camera, 6.0)
    lowres.render(camera)
    renderer.render(scene, camera)
    gl.readPixels(0, 0, 480, 300, gl.RGBA, gl.UNSIGNED_BYTE, px)
    let lit = 0
    for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 6) lit++
    // A divisor that links but draws nothing is the failure this is really
    // looking for: a wrong viewport rect or a stale material gives a clean
    // compile and an empty sky, and only a lit-pixel count catches it.
    const ok = shaderErrors === before && lit > 2000
    say((ok ? '  ok   ' : ' FAIL  ') + 'lowres div ' + div + ', blur ' + blur.toFixed(1), lit + ' lit px')
  }
  // Changing algorithm disposes the screen's material, so anything holding a
  // reference from construction time is now pointing at a disposed program.
  // This is the regression test for that, and it must come after a div > 1 run.
  {
    const before = shaderErrors
    lowres.setDiv(4)
    screen.setAlgorithm('weave')
    screen.setValues(defaultsFor('weave'))
    screen.update(camera, 6.0)
    lowres.render(camera)
    renderer.render(scene, camera)
    gl.readPixels(0, 0, 480, 300, gl.RGBA, gl.UNSIGNED_BYTE, px)
    let lit = 0
    for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 6) lit++
    say((shaderErrors === before && lit > 2000 ? '  ok   ' : ' FAIL  ') +
        'lowres survives setAlgorithm disposing the material', lit + ' lit px')
  }
  lowres.setDiv(1)
  lowres.dispose()
  scene.remove(lowres.mesh)
}

say('')
say(shaderErrors === 0 ? 'ALL SHADERS LINKED' : shaderErrors + ' SHADER FAILURES')
</script>
