<!doctype html>
<!--
  Throwaway compile-and-render probe for the card aurora, driven by headless
  Chrome + SwiftShader. It answers the two questions no static check can:
  does the assembled program LINK on a real WebGL2 context, and does the mesh
  actually put lit pixels on the screen once it has.

  The second question is the one that matters here. A card aurora has four
  distinct ways to link cleanly and draw nothing -- an attribute name that no
  longer matches the geometry, an instanceCount of zero, a gate that collapses
  every quad, a bounding sphere that culls the sky -- and every one of them
  looks exactly like a tuning that has gone dark.

  Not part of the app. Delete it when the technique is settled.
-->
<meta charset="utf-8">
<title>aurora cards probe</title>
<style>body{background:#000;color:#ccc;font:12px monospace}canvas{display:none}</style>
<div id="out">running</div>
<div id="shots"></div>
<script type="module">
import * as THREE from 'three'
import { AuroraCards } from '/src/aurora-cards/curtains.js'
import { defaults } from '/src/aurora-cards/params.js'
import { BUILTIN_PRESETS } from '/src/aurora-cards/presets.js'

const W = 480, H = 300

const lines = []
const say = (s, extra) => {
  lines.push(extra ? s + '   ' + extra : s)
  document.getElementById('out').textContent = lines.join('\n')
}

const canvas = document.createElement('canvas')
canvas.width = W; canvas.height = H
document.body.appendChild(canvas)

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H, false)

let shaderErrors = 0
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  shaderErrors++
  say('SHADER ERROR: ' + gl.getProgramInfoLog(prog))
  say('  vs: ' + (gl.getShaderInfoLog(vs) || '').split('\n').slice(0, 12).join('\n      '))
  say('  fs: ' + (gl.getShaderInfoLog(fs) || '').split('\n').slice(0, 12).join('\n      '))
}

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 40000)
camera.position.set(0, 2, 0)
camera.rotation.order = 'YXZ'
// A three camera with no rotation looks down -z, and -z is north, so this is
// already pointing at the belt. The pitch is atan(altLow / beltOffset) to
// within a few degrees, which puts the arc across the middle of the frame.
camera.rotation.y = 0
camera.rotation.x = 0.30

const cards = new AuroraCards(scene, {})

const gl = renderer.getContext()
const px = new Uint8Array(W * H * 4)

function frame(t) {
  cards.update(camera, t)
  renderer.render(scene, camera)
}

// Lit pixels, and the mean brightness over the lit ones. The second number is
// what separates "the sky is there" from "the sky is one stray triangle": a
// handful of lit pixels at full brightness is a bug, thousands at a low mean is
// an aurora.
function measure() {
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px)
  let lit = 0, sum = 0, peak = 0
  for (let i = 0; i < px.length; i += 4) {
    const v = px[i] + px[i + 1] + px[i + 2]
    if (v > 6) { lit++; sum += v }
    if (v > peak) peak = v
  }
  return { lit, mean: lit ? sum / lit / 3 : 0, peak: peak / 3, frac: lit / (W * H) }
}

// A frame is what forces the link, so every configuration below is rendered.
function trial(label, values, t, want) {
  const before = shaderErrors
  cards.setValues({ ...defaults(), ...values })
  frame(t)
  const m = measure()
  const linked = shaderErrors === before
  const ok = linked && (want === 'lit' ? m.lit > 200 : true)
  say((ok ? '  ok   ' : ' FAIL  ') + label,
    `${cards.stats.cards} cards  ${cards.stats.tris} tris  ${m.lit} lit px (${(m.frac * 100).toFixed(1)}%)  mean ${m.mean.toFixed(1)}  peak ${m.peak.toFixed(0)}`)
  return m
}

trial('defaults', {}, 3.0, 'lit')

for (const [name, preset] of Object.entries(BUILTIN_PRESETS)) {
  trial('preset: ' + name, preset.values, 3.0, 'lit')
}

// Both bodies of every uniform-valued branch have to link, and the all-off path
// is the one nothing else covers.
trial('all optional terms ON',
  { rays: 0.9, flowHue: 1, caustic: 0.9, beltAmt: 0.9, leyBend: 6, gateAmt: 0.7, patchAmt: 1, patchDrift: 1, swathAmt: 1, pulseAmt: 1, hemBlur: 6, faceCam: 1, extinct: 1 }, 3.0, 'lit')
trial('all optional terms OFF',
  { rays: 0, flowHue: 0, caustic: 0, beltAmt: 0, leyBend: 0, gateAmt: 0, patchAmt: 0, patchDrift: 0, swathAmt: 0, pulseAmt: 0, hemBlur: 1, faceCam: 0, extinct: 0 }, 3.0, 'lit')

// The degenerate-quad collapse: gate the sky right off and the vertex shader
// should throw every card off screen rather than draw a dim one.
{
  cards.setValues({ ...defaults(), gain: 0 })
  frame(3.0)
  const m = measure()
  say((m.lit === 0 ? '  ok   ' : ' FAIL  ') + 'gain 0 draws nothing at all', m.lit + ' lit px')
}

// Facing south. This used to be a measurement rather than an assertion, because
// the belt is a brightness term with a floor of 1 - beltAmt rather than a cull,
// and at the old default of 0.5 that floor left the southern sky at half
// brightness -- it measured 48% lit against the north's 46%, which is to say the
// belt was not confining anything. At a belt strength of 1 the floor is gone and
// the exponential runs all the way down, so the aurora is genuinely a band in
// the north and this can be a real assertion: the sky behind you has to be
// dramatically darker than the sky in front of it.
//
// The threshold is a RATIO rather than zero on purpose. A belt is a soft
// falloff, not a wall, and the nearest edge of a wide belt is still overhead, so
// demanding an empty southern sky would be demanding the wrong thing and would
// fail the moment anybody widened the band.
{
  cards.setValues(defaults())
  frame(6.0)
  const north = measure()
  camera.rotation.y = Math.PI
  frame(6.0)
  const south = measure()
  camera.rotation.y = 0
  const ratio = south.mean / Math.max(north.mean, 1e-6)
  say((ratio < 0.34 ? '  ok   ' : ' FAIL  ') + 'the belt actually confines the aurora to the north',
      `south is ${(ratio * 100).toFixed(1)}% of north's mean (${south.mean.toFixed(1)} vs ${north.mean.toFixed(1)}), ${(south.frac * 100).toFixed(1)}% vs ${(north.frac * 100).toFixed(1)}% lit`)
}

// Walking the world must not move the sky. The mesh is locked to the eye, so
// the two frames have to be pixel-identical, and this is the only check that
// can tell -- the lock is one line in update() and deleting it looks fine in a
// still frame.
{
  cards.setValues(defaults())
  frame(6.0)
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px)
  const a = px.slice()
  camera.position.set(8000, 2, 8000)
  frame(6.0)
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px)
  let diff = 0
  for (let i = 0; i < px.length; i++) if (px[i] !== a[i]) diff++
  say((diff === 0 ? '  ok   ' : ' FAIL  ') + 'sky is locked to the eye across a 11 km walk', diff + ' bytes differ')
  camera.position.set(0, 2, 0)
}

const shots = document.getElementById('shots')
function capture(name) {
  const d = document.createElement('div')
  d.className = 'shot'
  d.dataset.name = name
  d.textContent = canvas.toDataURL('image/png')
  shots.appendChild(d)
}

// Screenshots last, so a failure above is already on the page if one of these
// throws. Rendered at a few tunings because "is it beautiful" is the one
// question this file cannot answer for itself.
for (const [name, preset] of Object.entries(BUILTIN_PRESETS)) {
  cards.setValues({ ...defaults(), ...preset.values })
  frame(6.0)
  capture(name)
}

say('')
say(shaderErrors === 0 ? 'no shader errors' : shaderErrors + ' SHADER ERRORS')
const done = document.createElement('div')
done.id = 'done'
done.textContent = 'done'
document.body.appendChild(done)
</script>
