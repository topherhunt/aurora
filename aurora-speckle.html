<!doctype html>
<!--
  Throwaway probe, driven by scratchpad/speckle.sh under headless Chrome +
  SwiftShader. It answers two questions that argument alone could not settle.

  1. What ARE the "black pixels"? There is no NaN path in the shader -- every
     pow() base is a sat() or an abs(), and vnoise2 is a mix of hash21 values so
     it cannot leave 0..1 -- which leaves undersampling. A raymarch with a
     per-pixel dither is an unbiased Monte Carlo estimator of the altitude
     integral, and where a channel is thin the estimator's variance is enormous:
     neighbouring pixels sample a different set of altitudes, one lands inside
     the channel three times and the next lands inside it once. That reads as
     DARK speckle on bright ground, not as symmetric noise, which is exactly the
     complaint. The metric below is built to see that specific thing: a pixel
     much darker than the mean of its eight neighbours, in a neighbourhood that
     is itself bright.

  2. Does rendering small and upscaling fix it? Rendering the SAME frame at
     1/2, 1/4, 1/6 and 1/10 linear scale and upsampling in JS is a faithful
     simulation of the offscreen-target pipeline, because the dither keys off
     gl_FragCoord and therefore decorrelates per RENDERED pixel -- so the
     upsample averages independent samples, which is the entire mechanism.

  And the interesting third thing that falls out of 2: what the saved fill rate
  buys if you spend it back on steps.

  Not part of the app. Delete it when the lab is done.
-->
<meta charset="utf-8">
<title>aurora speckle probe</title>
<style>body{background:#000;color:#ccc;font:12px monospace}canvas{display:none}</style>
<pre id="out">running</pre>
<div id="shots"></div>
<script type="module">
import * as THREE from 'three'
import { AuroraScreen } from '/src/aurora-lab/screen.js'
import { BUILTIN_PRESETS } from '/src/aurora-lab/presets.js'

const lines = []
const say = s => { lines.push(s); document.getElementById('out').textContent = lines.join('\n') }

// Reference framing. Every trial renders this exact view; only the framebuffer
// size changes, so the aspect and therefore the composition is constant.
const W = 480, H = 300

const canvas = document.createElement('canvas')
document.body.appendChild(canvas)
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)

let shaderErrors = 0
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  shaderErrors++
  say('SHADER ERROR: ' + (gl.getShaderInfoLog(fs) || '').split('\n').slice(0, 8).join('\n  '))
}

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 40000)
camera.position.set(0, 2, 0)
camera.rotation.order = 'YXZ'
camera.rotation.y = 0      // three looks down -z with no rotation, and -z is north
camera.rotation.x = 0.30

const screen = new AuroraScreen(scene, { algorithm: 'leyline' })
const REF = BUILTIN_PRESETS.find(p => p.name === 'reference-v1').values
const FAST = BUILTIN_PRESETS.find(p => p.name === 'fast').values

// Render the frame at w x h and return an RGBA Uint8Array, bottom-up as
// readPixels gives it. Every trial goes through here so nothing can differ
// between them except the size and the uniforms.
function renderAt(w, h, values, t) {
  screen.setValues(values)
  renderer.setSize(w, h, false)
  screen.update(camera, t)
  renderer.render(scene, camera)
  const gl = renderer.getContext()
  const px = new Uint8Array(w * h * 4)
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px)
  return px
}

// Bilinear upsample to W x H. This is what the GPU's LinearFilter does when the
// composite pass reads a smaller target, so simulating it here rather than
// nearest-neighbour is the point -- half the artefact removal is the bilinear.
function upsample(px, w, h) {
  const out = new Uint8Array(W * H * 4)
  for (let y = 0; y < H; y++) {
    const sy = Math.min(h - 1.0001, Math.max(0, (y + 0.5) * h / H - 0.5))
    const y0 = Math.floor(sy), y1 = Math.min(h - 1, y0 + 1), fy = sy - y0
    for (let x = 0; x < W; x++) {
      const sx = Math.min(w - 1.0001, Math.max(0, (x + 0.5) * w / W - 0.5))
      const x0 = Math.floor(sx), x1 = Math.min(w - 1, x0 + 1), fx = sx - x0
      for (let c = 0; c < 4; c++) {
        const a = px[(y0 * w + x0) * 4 + c] * (1 - fx) + px[(y0 * w + x1) * 4 + c] * fx
        const b = px[(y1 * w + x0) * 4 + c] * (1 - fx) + px[(y1 * w + x1) * 4 + c] * fx
        out[(y * W + x) * 4 + c] = a * (1 - fy) + b * fy
      }
    }
  }
  return out
}

// 3x3 tent, the small extra blur the composite pass would apply on top of the
// hardware bilinear. Cheap on a GPU (it unrolls), and it is what turns "mostly
// smooth" into "smooth".
function tent(px) {
  const out = new Uint8Array(px.length)
  const wgt = [1, 2, 1, 2, 4, 2, 1, 2, 1]
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      for (let c = 0; c < 3; c++) {
        let s = 0, n = 0, k = 0
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++, k++) {
            const yy = y + dy, xx = x + dx
            if (yy < 0 || yy >= H || xx < 0 || xx >= W) continue
            s += px[(yy * W + xx) * 4 + c] * wgt[k]; n += wgt[k]
          }
        }
        out[(y * W + x) * 4 + c] = s / n
      }
      out[(y * W + x) * 4 + 3] = 255
    }
  }
  return out
}

// ---- the two metrics ------------------------------------------------------
//
// speckle: per-mille of bright pixels that are much darker than their own
//   neighbourhood. This is the "littered with black pixels" complaint, stated
//   as a number. A pixel only counts if its eight neighbours average above 40,
//   so a genuinely dark region cannot register.
//
// grain: mean absolute green difference to the right-hand neighbour over lit
//   pixels, which is the figure already recorded in presets.js. Kept so the two
//   probes stay comparable.
function metrics(px) {
  let dark = 0, bright = 0, gsum = 0, gn = 0
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = (y * W + x) * 4
      const g = px[i + 1]
      if (px[i] + g + px[i + 2] > 12 && x < W - 2) { gsum += Math.abs(g - px[i + 5]); gn++ }
      let m = 0
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue
        m += px[((y + dy) * W + (x + dx)) * 4 + 1]
      }
      m /= 8
      if (m < 40) continue
      bright++
      if (g < 0.5 * m) dark++
    }
  }
  return {
    speckle: bright ? 1000 * dark / bright : 0,
    grain: gn ? gsum / gn : 0,
    bright,
  }
}

// How far a candidate frame has drifted from the reference look. Mean absolute
// green difference per pixel against reference-v1 at full res: it does not care
// about noise cancelling out, so it measures STRUCTURE loss, which is the thing
// that would make a cheap tier not worth having.
function driftFrom(ref, px) {
  let s = 0
  for (let i = 0; i < W * H; i++) s += Math.abs(ref[i * 4 + 1] - px[i * 4 + 1])
  return s / (W * H)
}

const shots = document.getElementById('shots')
const c2 = document.createElement('canvas'); c2.width = W; c2.height = H
const ctx = c2.getContext('2d')
function shot(name, px) {
  // readPixels is bottom-up, putImageData is top-down, so flip on the way out.
  const img = ctx.createImageData(W, H)
  for (let y = 0; y < H; y++) img.data.set(px.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4)
  ctx.putImageData(img, 0, 0)
  const d = document.createElement('div')
  d.className = 'shot'; d.dataset.algo = name
  d.textContent = c2.toDataURL('image/png')
  shots.appendChild(d)
}

const T = 6.0
const pad = (s, n) => (s + '                                        ').slice(0, n)

// ---- 1. is the speckle undersampling? Sweep steps at full res, and turn the
// dither off at the low end, which separates the two failure modes: dither ON
// gives grain, dither OFF gives concentric shells. If speckle tracks 1/steps
// with the dither on, it is variance and nothing else.
say('FULL RES, DITHER ON -- does speckle track 1/steps?')
say('  ' + pad('preset', 34) + pad('speckle/1000', 14) + 'grain')
const refPx = renderAt(W, H, REF, T)
say('  ' + pad('reference-v1 (40 steps)', 34) + pad(metrics(refPx).speckle.toFixed(1), 14) + metrics(refPx).grain.toFixed(2))
shot('a-reference-40', refPx)
for (const s of [12, 16, 20, 24, 32]) {
  const px = renderAt(W, H, { ...FAST, steps: s }, T)
  const m = metrics(px)
  say('  ' + pad('fast @ ' + s + ' steps', 34) + pad(m.speckle.toFixed(1), 14) + m.grain.toFixed(2))
  if (s === 20) shot('b-fast-20-fullres', px)
}
say('')
say('FULL RES, DITHER OFF -- the same steps without the randomisation')
for (const s of [20, 40]) {
  const px = renderAt(W, H, { ...FAST, steps: s, dither: 0 }, T)
  const m = metrics(px)
  say('  ' + pad('fast @ ' + s + ' steps, dither 0', 34) + pad(m.speckle.toFixed(1), 14) + m.grain.toFixed(2))
}

// ---- 2. render small, upsample, blur. Divisors chosen so both axes stay whole
// numbers at 480x300, because a fractional height would change the framing and
// quietly invalidate the comparison.
say('')
say('RENDER SMALL, BILINEAR UPSAMPLE + 3x3 TENT  (fast @ 20 steps)')
say('  ' + pad('scale', 34) + pad('speckle/1000', 14) + pad('grain', 10) + pad('drift', 10) + 'rel fill')
for (const [div, w, h] of [[1, 480, 300], [2, 240, 150], [4, 120, 75], [6, 80, 50], [10, 48, 30]]) {
  const small = renderAt(w, h, { ...FAST, steps: 20 }, T)
  const up = tent(upsample(small, w, h))
  const m = metrics(up)
  say('  ' + pad('1/' + div + '  (' + w + 'x' + h + ')', 34) + pad(m.speckle.toFixed(1), 14) +
      pad(m.grain.toFixed(2), 10) + pad(driftFrom(refPx, up).toFixed(2), 10) + (1 / (div * div)).toFixed(4))
  if (div === 4 || div === 10) shot('c-div' + div + '-20steps', up)
}

// ---- 3. the actual proposition: spend the saved fill rate back on steps.
// Every row here costs LESS than one full-res 20-step frame; the last column
// says how much less. If the speckle column also goes to nothing, then cheap
// and clean are the same setting rather than a trade.
say('')
say('SMALL + MORE STEPS -- cost relative to full-res 20 steps')
say('  ' + pad('scale @ steps', 34) + pad('speckle/1000', 14) + pad('grain', 10) + pad('drift', 10) + 'rel cost')
for (const [div, w, h, s] of [[4, 120, 75, 40], [4, 120, 75, 64], [6, 80, 50, 64], [6, 80, 50, 96], [10, 48, 30, 96]]) {
  const small = renderAt(w, h, { ...FAST, steps: s }, T)
  const up = tent(upsample(small, w, h))
  const m = metrics(up)
  say('  ' + pad('1/' + div + ' (' + w + 'x' + h + ') @ ' + s + ' steps', 34) + pad(m.speckle.toFixed(1), 14) +
      pad(m.grain.toFixed(2), 10) + pad(driftFrom(refPx, up).toFixed(2), 10) + (s / (20 * div * div)).toFixed(4))
  shot('d-div' + div + '-' + s + 'steps', up)
}

// The reference at two warp stages, rendered small, is the best case for
// "cheap AND the look the user already approved" -- it is the pinned preset,
// not the cut-down one, at a fraction of the fill rate.
{
  const small = renderAt(80, 50, { ...REF, steps: 64 }, T)
  const up = tent(upsample(small, 80, 50))
  const m = metrics(up)
  say('')
  say('  ' + pad('reference-v1 @ 1/6, 64 steps', 34) + pad(m.speckle.toFixed(1), 14) +
      pad(m.grain.toFixed(2), 10) + pad(driftFrom(refPx, up).toFixed(2), 10) + (64 / (40 * 36)).toFixed(4))
  shot('e-reference-div6-64steps', up)
}

say('')
say(shaderErrors === 0 ? 'ALL SHADERS LINKED' : shaderErrors + ' SHADER FAILURES')
</script>
