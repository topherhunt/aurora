<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gen-crab</title>
    <style>
      :root { --panel: rgba(8,14,26,.88); --edge: #2b4a72; --ink: #cfe3ff; --dim: #7f96b8; --good: #6fbf73; --warn: #c9a227; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden; background: #05080f; color: var(--ink);
        font: 12px/1.5 monospace; display: flex;
      }
      canvas { display: block; }

      h2 {
        margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
        color: var(--dim); font-weight: normal;
      }
      h2:not(:first-child) { margin-top: 14px; border-top: 1px solid #1b2c44; padding-top: 10px; }

      input, select, button {
        font: inherit; color: var(--ink); background: #0e1726;
        border: 1px solid var(--edge); border-radius: 3px; padding: 3px 5px; min-width: 0;
      }
      button { cursor: pointer; }
      button:hover { background: #17263c; }
      button.on { background: #1d3a5f; border-color: #4a7fbf; color: #eaf3ff; }

      /* --- left: the controls ------------------------------------------ */
      #panel {
        flex: 0 0 300px; display: flex; flex-direction: column;
        border-right: 1px solid var(--edge); background: var(--panel);
      }
      #panel > header { padding: 8px 10px; border-bottom: 1px solid #1b2c44; }
      #panel > header .t { color: #eaf3ff; letter-spacing: .06em; }
      #panel > header .s { color: var(--dim); font-size: 11px; }
      #controls { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px; }

      .row { display: grid; grid-template-columns: 84px 1fr 46px; gap: 6px; align-items: center; margin-bottom: 3px; }
      .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
      .row input[type=range] { width: 100%; padding: 0; background: none; border: none; }
      .row .v { text-align: right; font-variant-numeric: tabular-nums; }

      #seedrow { display: flex; gap: 6px; margin-bottom: 8px; }
      #seedrow input { flex: 1 1 auto; }
      #buttons { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-top: 1px solid #1b2c44; }
      #buttons button { flex: 1 1 auto; padding: 4px 6px; }

      /* --- centre: viewport -------------------------------------------- */
      #stage { flex: 1 1 auto; position: relative; min-width: 0; }
      #hint { position: absolute; left: 10px; top: 10px; color: var(--dim); pointer-events: none; }

      /* --- right: the budget ------------------------------------------- */
      #budget {
        flex: 0 0 296px; overflow-y: auto; padding: 8px 10px;
        border-left: 1px solid var(--edge); background: var(--panel);
      }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 1px 0; vertical-align: baseline; }
      td.k { color: var(--dim); }
      td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .note { color: var(--dim); margin: 6px 0 0; font-size: 11px; }
      .big { font-size: 15px; color: #eaf3ff; }
      .ok { color: var(--good); } .warn { color: var(--warn); }
      #swatch { width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--edge); border-radius: 3px; background: #0e1726; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <div class="t">PROCEDURAL CRABS</div>
        <div class="s">one carapace, pincers, eyestalks and legs, grown by code</div>
      </header>
      <div id="controls">
        <h2>seed</h2>
        <div id="seedrow">
          <input type="number" id="seed" value="1" min="0" step="1" />
          <button id="reroll">reroll</button>
        </div>

        <div id="sliders"></div>

        <h2>palette</h2>
        <div id="palette"></div>
      </div>
      <div id="buttons">
        <button id="wire">wireframe</button>
        <button id="spin">spin</button>
        <button id="reset">defaults</button>
      </div>
    </div>

    <div id="stage"><div id="hint">drag to orbit &middot; scroll to zoom</div></div>

    <div id="budget">
      <h2>geometry</h2>
      <table id="geo"></table>

      <h2>texture cost</h2>
      <table id="mem"></table>
      <p class="note" id="memnote"></p>

      <h2>sheets</h2>
      <canvas id="swatch" width="288" height="112"></canvas>
      <p class="note" id="swatchnote"></p>

      <h2>source</h2>
      <table id="source"></table>
      <p class="note" id="sourcenote"></p>
    </div>

    <script type="module" src="/src/gen-crab-main.js"></script>
  </body>
</html>
