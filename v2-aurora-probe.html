<!doctype html>
<!--
  Compile-and-render probe for src/v2/render/aurora.js, served by vite and
  loaded under headless Chrome + SwiftShader. /v2 itself is not a viable probe
  target: booting it means terrain generation, prop atlas fetches and a walk to
  a vantage point, none of which say anything about the aurora. This is the same
  module /v2 constructs, in an empty scene.

  Eight checks, each answering something static analysis cannot:
    1. does the assembled fragment shader LINK on a real WebGL2 context
    2. do the four sky-map prepasses leave the render target where they found it
    3. does the dome go dark at noon, and cost nothing while it is dark
    4. does the activity ramp move the OVAL rather than only the brightness
    5. does the zenith stay lit and finite now that the dome reaches 90 degrees
    6. is the north still brighter than the south at every activity
    7. does p cycle auto -> four forms -> auto
    8. does the dome ride the head rather than sliding away over a long walk

  Load it with #sweep for the belt tuning table instead: it re-renders the map
  with beltOffset/beltWidth/beltAmt overridden and reports the north/south ratio
  per candidate, which is where the numbers in design/13-aurora-and-sky.md came
  from. Not part of the app, and not gated -- it needs a GPU.
-->
<meta charset="utf-8">
<title>v2 aurora probe</title>
<style>body{background:#000;color:#ccc;font:12px monospace}canvas{display:none}</style>
<div id="out">running</div>
<div id="shots"></div>
<script type="module">
import * as THREE from 'three'
import { SkyAurora } from '/src/v2/render/aurora.js'

const lines = []
const say = (s, extra) => {
  lines.push(extra ? s + '   ' + extra : s)
  document.getElementById('out').textContent = lines.join('\n')
}

const W = 480, H = 300
const canvas = document.createElement('canvas')
canvas.width = W; canvas.height = H
document.body.appendChild(canvas)

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H, false)
renderer.outputColorSpace = THREE.SRGBColorSpace

let shaderErrors = 0
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  shaderErrors++
  say('SHADER ERROR: ' + gl.getProgramInfoLog(prog))
  say('  fs: ' + (gl.getShaderInfoLog(fs) || '').split('\n').slice(0, 12).join('\n      '))
}

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 20000)
camera.rotation.order = 'YXZ'
// A three camera looks down -z with no rotation, and -z is north, so this is
// already facing the belt.
camera.position.set(0, 2, 0)
camera.rotation.set(0.30, 0, 0)

const head = new THREE.Vector3(0, 2, 0)

// Exactly the call /v2 makes.
const aurora = new SkyAurora(scene, { renderer, seed: 1337 })

// The two numbers clock.js hands over, and nothing else is read.
const state = (aurora_, activity) => ({ aurora: aurora_, activity })

function shoot(name) {
  const el = document.createElement('div')
  el.className = 'shot'
  el.dataset.algo = name
  el.textContent = canvas.toDataURL('image/png')
  document.getElementById('shots').appendChild(el)
}

// Lit pixels and the brightest one, read back off the canvas.
function measure() {
  const gl = renderer.getContext()
  const px = new Uint8Array(W * H * 4)
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px)
  let lit = 0, max = 0, sum = 0, bad = 0
  for (let i = 0; i < W * H; i++) {
    const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2]
    const v = Math.max(r, g, b)
    if (!Number.isFinite(v)) bad++
    if (v > 8) lit++
    if (v > max) max = v
    sum += v
  }
  return { lit, max, mean: sum / (W * H), bad }
}

function frame(s, t) {
  aurora.update(head, s, t)
  renderer.render(scene, camera)
  return measure()
}

// ---- 1. the shader links, and the map is built and read
{
  const before = shaderErrors
  const m = frame(state(1.0, 0.9), 7.0)
  say((shaderErrors === before ? '  ok   ' : ' FAIL  ') + 'storm night links and draws',
    `lit ${m.lit}/${W * H}  max ${m.max}  mean ${m.mean.toFixed(1)}`)
  say((m.lit > 5000 ? '  ok   ' : ' FAIL  ') + 'the northern sky is actually lit', `${m.lit} px over 8`)
  shoot('v2-storm')
}

// ---- 2. the prepass leaves the render target where it found it
{
  const t = renderer.getRenderTarget()
  say((t === null ? '  ok   ' : ' FAIL  ') + 'render target restored after the four prepasses', String(t))
}

// ---- 3. noon costs nothing: hidden, and no prepass
{
  const m = frame(state(0.0, 0.5), 8.0)
  say((!aurora.mesh.visible ? '  ok   ' : ' FAIL  ') + 'hidden at noon (state.aurora 0)')
  say((m.lit === 0 ? '  ok   ' : ' FAIL  ') + 'and nothing is drawn', `lit ${m.lit}`)
  say('  ..   label at noon', JSON.stringify(aurora.label))
}

// ---- 4. the activity ramp moves the belt rather than just the brightness.
// Held at ONE intensity on purpose, so anything that changes is shape.
//
// The measure is the mean rather than the lit count: a lit count counts the
// skirt, which is broad at every activity, and a quiet arc that fills the same
// number of pixels far more dimly would pass a count and fail the eye.
{
  const seen = []
  for (const a of [0.16, 0.45, 0.75, 1.0]) {
    const m = frame(state(0.85, a), 9.0)
    seen.push({ a, off: aurora.screen.getParam('beltOffset'), wid: aurora.screen.getParam('beltWidth'), ...m })
    say('  ..   activity ' + a.toFixed(2),
      `belt ${seen[seen.length - 1].off.toFixed(0)} km  width ${seen[seen.length - 1].wid.toFixed(0)}  lit ${m.lit}  mean ${m.mean.toFixed(1)}`)
  }
  const monotone = seen.every((s, i) => i === 0 || (s.off > seen[i - 1].off && s.wid > seen[i - 1].wid))
  say((monotone ? '  ok   ' : ' FAIL  ') + 'the oval moves in and widens as activity rises')
  say((seen[0].mean < seen[1].mean * 0.75 ? '  ok   ' : ' FAIL  ') + 'a quiet night is markedly dimmer than an active one at the same intensity',
    `${seen[0].mean.toFixed(1)} vs ${seen[1].mean.toFixed(1)}`)
  shoot('v2-storm-full')
}

// ---- 5. straight up. The dome now reaches 90 degrees and the map stops at 88,
// so this is the case the zenith dissolve has to carry on its own.
{
  camera.rotation.set(Math.PI / 2 - 0.05, 0, 0)
  const before = shaderErrors
  const m = frame(state(1.0, 0.9), 10.0)
  say((shaderErrors === before && m.bad === 0 ? '  ok   ' : ' FAIL  ') + 'zenith is finite and does not smear',
    `lit ${m.lit}  max ${m.max}  mean ${m.mean.toFixed(1)}`)
  shoot('v2-zenith')
  camera.rotation.set(0.30, 0, 0)
}

// ---- 6. north against south, at every activity. The dome is full now, so the
// southern sky draws and the BELT is the only thing that can make it dimmer.
// This is the check that keeps ACTIVITY_SHAPE honest: widen the storm end far
// enough and the sky ends up brighter behind her than in front, which is the one
// failure the geometry makes easy. See the note on the table.
//
// Averaged over eight instants, NOT measured at one. The belt is a smooth bias
// of maybe 1.5x on the storm end, and a single frame of the field can beat that
// by luck -- one bright braid happening to land behind her. A one-frame version
// of this check reported the southern sky brighter at a = 1.0 while the belt
// term at those texels was provably 0.87 north against 0.60 south, i.e. it was
// reading the field's dice and calling it a tuning defect. Eight samples spread
// across a minute average the braids out and leave the bias.
{
  let ok = true
  const TS = [ 11.0, 18.5, 26.0, 33.5, 41.0, 48.5, 56.0, 63.5 ]
  for (const a of [0.16, 0.45, 0.75, 1.0]) {
    let ns = 0, ss = 0, worst = Infinity
    for (const t of TS) {
      camera.rotation.set(0.30, 0, 0)
      const n = frame(state(1.0, a), t)
      camera.rotation.set(0.30, Math.PI, 0)
      const s = frame(state(1.0, a), t)
      ns += n.mean; ss += s.mean
      worst = Math.min(worst, n.mean / s.mean)
    }
    const n = ns / TS.length, s = ss / TS.length
    if (!(n > s)) ok = false
    say('  ..   activity ' + a.toFixed(2),
      `north mean ${n.toFixed(1)}  south mean ${s.toFixed(1)}  ratio ${(n / s).toFixed(2)}  worst frame ${worst.toFixed(2)}`)
  }
  say((ok ? '  ok   ' : ' FAIL  ') + 'the north is brighter than the south at every activity')
  camera.rotation.set(0.30, Math.PI, 0)
  frame(state(1.0, 0.9), 11.0)
  shoot('v2-south')
  camera.rotation.set(0.30, 0, 0)
}

// ---- 6b. TUNING SWEEP, not an assertion. Re-renders the sky map with the belt
// forced to candidate triples so the north/south ratio can be read as a curve
// instead of guessed at. Overriding has to happen BETWEEN update() and the map
// render, because update() writes the belt from ACTIVITY_SHAPE and then renders
// the map in the same call -- setting a param after it returns would be read a
// frame late.
if (location.hash === '#sweep') {
  const TS = [ 11.0, 26.0, 41.0, 56.0 ]
  const look = (yaw, t) => {
    camera.rotation.set(0.30, yaw, 0)
    renderer.render(scene, camera)
    return measure().mean
  }
  const trial = (off, wid, amt) => {
    let ns = 0, ss = 0
    for (const t of TS) {
      aurora.update(head, state(1.0, 1.0), t)
      aurora.screen.setParam('beltOffset', off)
      aurora.screen.setParam('beltWidth', wid)
      aurora.screen.setParam('beltAmt', amt)
      aurora.skymap.render('skymap', aurora.screen.values, t)
      ns += look(0, t); ss += look(Math.PI, t)
    }
    say(`  ..   belt ${String(off).padStart(5)} km  width ${String(wid).padStart(4)}  amt ${amt.toFixed(2)}`,
      `north ${(ns / TS.length).toFixed(1)}  south ${(ss / TS.length).toFixed(1)}  ratio ${(ns / ss).toFixed(2)}`)
  }
  say('  --   storm-end sweep (a = 1.0)')
  for (const amt of [0.66, 0.80]) {
    for (const [off, wid] of [[-260, 620], [-360, 560], [-460, 500], [-560, 440]]) trial(off, wid, amt)
  }
  camera.rotation.set(0.30, 0, 0)
}

// ---- 7. the pattern cycle, which is the p key in /v2. Five states -- auto plus
// four forms -- so five presses is a round trip.
{
  let ok = true
  const seen = []
  for (let i = 0; i < 5; i++) {
    const n = aurora.cyclePattern()
    frame(state(0.9, 0.5), 12.0 + i)
    seen.push(`${n}:${aurora.label.slice(0, 30)}`)
    if (!(n >= -1 && n < 4)) ok = false
  }
  say((ok && aurora.pattern === -1 ? '  ok   ' : ' FAIL  ') + 'p cycles auto -> four forms -> auto')
  for (const s of seen) say('  ..   ' + s)
}

// ---- 8. walking. The dome must ride the head and the sky must not slide.
{
  head.set(4000, 2, -4000)
  const before = shaderErrors
  const m = frame(state(1.0, 0.9), 13.0)
  const onHead = aurora.mesh.position.distanceTo(head) < 1e-6
  say((onHead && shaderErrors === before ? '  ok   ' : ' FAIL  ') + 'dome rides the head 5.6 km out',
    `lit ${m.lit}  mean ${m.mean.toFixed(1)}`)
  head.set(0, 2, 0)
}

say('')
say(shaderErrors === 0 ? 'shader errors: 0' : 'SHADER ERRORS: ' + shaderErrors)
say('done')
</script>
