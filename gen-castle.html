<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora -- castle layout</title>
    <style>
      :root { --panel: rgba(8,14,26,.88); --edge: #2b4a72; --ink: #cfe3ff; --dim: #7f96b8; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; background: #05080f; color: var(--ink); font: 12px/1.5 monospace; display: flex; }
      canvas { display: block; }
      h2 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: normal; border-top: 1px solid #1b2c44; padding-top: 10px; }
      h2:first-child { margin-top: 0; border-top: none; padding-top: 0; }
      input, button { font: inherit; color: var(--ink); background: #0e1726; border: 1px solid var(--edge); border-radius: 3px; padding: 3px 5px; min-width: 0; }
      button { cursor: pointer; }
      button:hover { background: #17263c; }
      button.on { background: #1d3a5f; border-color: #4a7fbf; color: #eaf3ff; }
      #panel { flex: 0 0 340px; display: flex; flex-direction: column; border-right: 1px solid var(--edge); background: var(--panel); }
      #panel > header { padding: 8px 10px; border-bottom: 1px solid #1b2c44; }
      #panel > header .t { color: #eaf3ff; letter-spacing: .06em; }
      #panel > header .s { color: var(--dim); font-size: 11px; }
      #controls { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px; }
      .pick { display: flex; gap: 6px; margin-bottom: 6px; }
      .pick input { flex: 1 1 auto; }
      .pick input[type=range] { padding: 0; }
      #buttons { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-top: 1px solid #1b2c44; }
      #buttons button { flex: 1 1 auto; padding: 4px 6px; }
      #stage { flex: 1 1 auto; position: relative; min-width: 0; }
      #hint { position: absolute; left: 10px; top: 10px; color: var(--dim); pointer-events: none; }
      table { border-collapse: collapse; }
      td { padding: 0 0 0 10px; }
      td:first-child { padding: 0; color: var(--dim); }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      .legend { color: var(--dim); }
      .legend b { font-weight: normal; }
      ol { margin: 0; padding-left: 26px; color: var(--dim); }
      ol li span { color: var(--ink); }
      .pass { color: #7fe07f; } .fail { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="panel">
      <header>
        <div class="t">CASTLE LAYOUT</div>
        <div class="s">the path graph, the exterior it implies, and the rooms inside at 1.5x</div>
      </header>
      <div id="controls">
        <h2>seed</h2>
        <div class="pick">
          <button id="prev" class="qa-prev">&lt;</button>
          <input type="number" id="seed" class="qa-seed" value="1" min="0" step="1" />
          <button id="reroll" class="qa-reroll">reroll</button>
        </div>
        <h2>view</h2>
        <div class="pick">
          <button id="view" class="qa-view">exterior</button>
          <button id="ghost" class="qa-ghost">ghost</button>
        </div>
        <div class="pick">
          <span class="legend">storeys to</span>
          <input type="range" id="cut" class="qa-cut" min="0" max="8" value="8" />
          <span id="cutLabel" class="qa-cut-label">all</span>
        </div>
        <h2>stats</h2>
        <table id="statsTable" class="qa-stats"></table>
        <h2>legend</h2>
        <div class="legend" id="legend"></div>
        <h2>route, gate to summit</h2>
        <ol id="routeList" class="qa-route-list"></ol>
      </div>
      <div id="buttons">
        <button id="graph" class="qa-graph on">graph</button>
        <button id="labels" class="qa-labels on">labels</button>
        <button id="route" class="qa-route on">route</button>
        <button id="wire" class="qa-wire">wire</button>
        <button id="spin" class="qa-spin">spin</button>
      </div>
    </div>
    <div id="stage">
      <div id="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan &middot; i flips inside/outside &middot; r rerolls &middot; [ ] storeys</div>
    </div>
    <script type="module" src="/src/gen-castle-main.js"></script>
  </body>
</html>
